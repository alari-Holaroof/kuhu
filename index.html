<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KUHU?</title>
<meta name="description" content="Kõik Eesti üritused ühel kaardil: kontserdid, etendused, kino, laadad, mootorsport, rahvamajad ja kultuurimajad sinu lähedal.">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikoon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,800;112..125,900&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
/* Ühe teemaga kujundus: must + oranž (kasutaja soov), ei sõltu seadme heledast/tumedast režiimist */
:root{
  --must:#0b0b0c; --pind:#131315; --pind2:#1b1b1e; --pind3:#242428; --joon:#2a2a2f;
  --tint:#f5f2ed; --tint2:#aaa59f; --tint3:#6f6b66;
  --oranz:#ff6a13; --oranz2:#ff8a3d; --oranz-tume:#3a1d0c; --oranz-pehme:rgba(255,106,19,.14);
  --mina:#4da3ff; --vari:0 10px 30px rgba(0,0,0,.55);
  --r:14px;
  --display:"Archivo",Figtree,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--must);color:var(--tint);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oranz);outline-offset:2px}
::selection{background:var(--oranz);color:#000}

.rakendus{display:grid;grid-template-columns:430px 1fr;height:100%}
.paneel{display:flex;flex-direction:column;min-height:0;background:var(--must);border-right:1px solid var(--joon);z-index:2}
.pais{min-width:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--joon);background:var(--must)}
.nimerida{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font:900 30px/1 var(--display);font-stretch:125%;letter-spacing:-.01em;margin:0}
h1 .kysi{color:var(--oranz)}
.uuendatud{font-size:11px;color:var(--tint3);text-align:right;line-height:1.3}
.otsing{display:flex;gap:8px}
.otsing input{flex:1;min-width:0;border:1px solid var(--joon);background:var(--pind);border-radius:12px;padding:10px 12px;color:var(--tint)}
.otsing input::placeholder{color:var(--tint3)}
.otsing input:focus{border-color:var(--oranz);outline:none}
.nupp{border:1px solid var(--joon);background:var(--pind2);border-radius:12px;padding:9px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:700;color:var(--tint)}
.nupp:hover{border-color:var(--tint3)}
.nupp.pea{background:var(--oranz);border-color:var(--oranz);color:#120800}
.nupp.pea:hover{background:var(--oranz2)}
.nupp svg{width:17px;height:17px;flex:none}

/* ajavalik */
.paevad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.paevanupp{border:1px solid var(--joon);background:var(--pind);border-radius:14px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;transition:background .15s,border-color .15s}
.paevanupp span{font:800 14px/1.1 var(--display);font-stretch:112%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.paevanupp b{font-size:12px;font-weight:700;color:var(--tint3);font-variant-numeric:tabular-nums;white-space:nowrap}
.paevanupp:hover{border-color:var(--tint3)}
.paevanupp[aria-pressed="true"]{background:var(--oranz);border-color:var(--oranz);color:#120800}
.paevanupp[aria-pressed="true"] b{color:#120800;opacity:.75}
.paevanupp.kal svg{width:15px;height:15px;vertical-align:-2px;margin-right:3px}

.kalender{background:var(--pind);border:1px solid var(--joon);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.kal-kiirvalik{display:flex;gap:6px;flex-wrap:wrap}
.kal-kuud{display:flex;flex-direction:column;gap:12px;max-height:340px;overflow-y:auto;overscroll-behavior:contain}
.kal-kuu h4{margin:0 0 6px;font:800 13px/1 var(--display);font-stretch:112%;text-transform:uppercase;letter-spacing:.06em;color:var(--tint2)}
.kal-ruudud{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.kal-nadalap{font-size:11px;font-weight:700;color:var(--tint3);text-align:center;padding-bottom:2px}
.kal-paev{border:0;border-radius:10px;background:transparent;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;color:var(--tint)}
.kal-paev .nr{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.kal-paev .arv{font-size:10px;font-weight:700;color:var(--oranz2);font-variant-numeric:tabular-nums;min-height:12px}
.kal-paev[data-tase="1"]{background:rgba(255,106,19,.08)}
.kal-paev[data-tase="2"]{background:rgba(255,106,19,.16)}
.kal-paev[data-tase="3"]{background:rgba(255,106,19,.26)}
.kal-paev:hover{outline:1px solid var(--tint3)}
.kal-paev.vahemik{background:var(--oranz-tume);border-radius:0}
.kal-paev.valitud{background:var(--oranz);color:#120800;border-radius:10px}
.kal-paev.valitud .arv{color:#120800}
.kal-paev:disabled{opacity:.25;cursor:default;outline:0}
.kal-paev.tana .nr{text-decoration:underline;text-decoration-color:var(--oranz);text-underline-offset:3px}
.kal-jalus{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--tint2)}

.kiibid{display:flex;gap:6px;flex-wrap:wrap}
.kiip{flex:none;border:1px solid var(--joon);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--tint2);display:inline-flex;align-items:center;gap:6px}
.kiip:hover{border-color:var(--tint3);color:var(--tint)}
.kiip[aria-pressed="true"]{background:var(--tint);border-color:var(--tint);color:var(--must)}
.kiip.aktsent[aria-pressed="true"]{background:var(--oranz);border-color:var(--oranz);color:#120800}

.seaded{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--tint2)}
.seaded select{border:1px solid var(--joon);background:var(--pind);border-radius:8px;padding:5px 6px;color:var(--tint)}
.seaded label{display:inline-flex;align-items:center;gap:6px}
.seaded input[type=checkbox]{accent-color:var(--oranz);width:16px;height:16px}
.asukoht{font-size:13px;color:var(--tint2);display:flex;align-items:center;gap:7px;min-height:20px}
.asukoht b{color:var(--tint)}
.punkt{width:9px;height:9px;border-radius:50%;background:var(--tint3);flex:none}
.punkt.gps{background:var(--mina);box-shadow:0 0 0 3px rgba(77,163,255,.3)}
.ikoonid{display:flex;gap:6px}
.ikoon{width:40px;height:40px;border-radius:12px;border:1px solid var(--joon);background:var(--pind2);display:grid;place-items:center;color:var(--tint)}
.ikoon svg{width:19px;height:19px}
.ikoon[aria-expanded="true"]{background:var(--oranz);border-color:var(--oranz);color:#120800}
#otsi{border:1px solid var(--oranz);background:var(--pind);border-radius:12px;padding:10px 12px;color:var(--tint);width:100%}
.seaded{background:var(--pind);border:1px solid var(--joon);border-radius:16px;padding:12px}
.seaded .asukoht{width:100%}
.seaded .uuendatud{width:100%;text-align:left}

/* nimekiri */
.nimekiri{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 0 calc(84px + env(safe-area-inset-bottom,0px));background:var(--must)}
.kokkuvote{padding:12px 16px 8px;font-size:13px;color:var(--tint2)}
.kokkuvote b{color:var(--oranz);font-variant-numeric:tabular-nums}
.paev{position:sticky;top:0;background:rgba(11,11,12,.92);backdrop-filter:blur(8px);padding:12px 16px 7px;font:800 12px/1 var(--display);font-stretch:112%;letter-spacing:.08em;text-transform:uppercase;color:var(--oranz);border-bottom:1px solid var(--joon);z-index:1}
.yr{display:grid;grid-template-columns:54px 1fr auto;gap:12px;padding:12px 16px;border:0;border-bottom:1px solid var(--joon);cursor:pointer;background:none;text-align:left;width:100%;color:var(--tint)}
.yr:hover{background:var(--pind)}
.yr .kell{font:800 16px/1.15 var(--display);font-variant-numeric:tabular-nums}
.yr .kell small{display:block;font:600 11px/1.3 Figtree,sans-serif;color:var(--tint3)}
.yr .pk{font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yr .koht{font-size:13px;color:var(--tint2);margin-top:2px}
.yr .silt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--tint3);margin-top:4px}
.yr .kaugus{font-size:12px;font-weight:800;color:var(--tint2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--oranz-pehme);color:var(--oranz2)}
.pill.kaib{background:rgba(77,220,140,.14);color:#6fe0a0}
.tyhi{padding:40px 24px;text-align:center;color:var(--tint2)}
.lisa{display:flex;margin:14px auto}
.allikad{padding:16px 16px 24px;font-size:12px;color:var(--tint3)}
.allikad a{color:var(--tint2)}

/* kaart */
#kaart{height:100%;width:100%;background:#e8e6e1}
.hele-kaart{filter:saturate(.7) contrast(.96)}
.kaardiala{position:relative;min-height:0}
.kaardinupud{position:absolute;right:12px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:500;display:flex;flex-direction:column;gap:8px}
.kaardinupud .nupp{box-shadow:var(--vari);padding:11px}
.vaheta{display:none}
.m{display:grid;place-items:center;min-width:30px;height:30px;padding:0 7px;border-radius:999px;background:var(--oranz);color:#120800;font:800 13px/1 Figtree,sans-serif;border:2px solid #0b0b0c;box-shadow:0 0 0 2px rgba(255,106,19,.35),0 4px 10px rgba(0,0,0,.6);transform:translate(-50%,-50%);width:max-content}
.m.yks{min-width:18px;height:18px;padding:0;font-size:0}
.maja{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--pind2);border:1.5px solid var(--tint3);color:var(--tint2);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.maja svg{width:12px;height:12px}
.mina{width:18px;height:18px;border-radius:50%;background:var(--mina);border:3px solid #fff;box-shadow:0 0 0 7px rgba(77,163,255,.25),0 1px 4px rgba(0,0,0,.5)}
.marker-cluster{background:rgba(255,106,19,.22);border-radius:50%}
.marker-cluster div{width:30px;height:30px;margin:5px;border-radius:50%;text-align:center;background:var(--oranz);color:#120800;font:800 12px/30px Figtree,sans-serif}
.leaflet-bar a{background:var(--pind2);color:var(--tint);border-color:var(--joon)!important}
.leaflet-bar a:hover{background:var(--pind3);color:var(--tint)}
.leaflet-bar{border:1px solid var(--joon)!important;box-shadow:var(--vari)!important}
.leaflet-control-attribution{background:rgba(11,11,12,.7)!important;color:var(--tint3)!important}
.leaflet-control-attribution a{color:var(--tint2)!important}
.leaflet-popup-content-wrapper{background:var(--pind);color:var(--tint);border-radius:16px;box-shadow:var(--vari);border:1px solid var(--joon)}
.leaflet-popup-tip{background:var(--pind)}
.leaflet-popup-content{margin:14px 16px;font:14px/1.4 Figtree,sans-serif;width:290px!important;max-width:calc(100vw - 80px)}
.leaflet-container a.leaflet-popup-close-button{color:var(--tint3)}
.leaflet-container{font-family:Figtree,sans-serif}
.pp h3{font:800 18px/1.15 var(--display);font-stretch:112%;margin:0 0 3px}
.pp .aad{color:var(--tint2);font-size:12px;margin-bottom:10px}
.pp .tyyp{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--oranz);margin-bottom:4px}
.pp ul{list-style:none;margin:0;padding:0;max-height:250px;overflow-y:auto}
.pp li{padding:8px 0;border-top:1px solid var(--joon)}
.pp li a{color:var(--tint);font-weight:700;text-decoration:none}
.pp li a:hover{color:var(--oranz2)}
.pp .aeg{font-size:12px;color:var(--tint2);font-variant-numeric:tabular-nums}
.pp .aeg b{color:var(--oranz2)}
.pp img{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:var(--pind2)}
.pp .lingid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;align-items:center}
.pp .juhata{background:var(--oranz);color:#120800!important;font-weight:800;border-radius:10px;padding:8px 12px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.pp .juhata svg{width:15px;height:15px}
.pp .lingid a:not(.juhata){color:var(--oranz2);font-weight:700}
.pp .ligi{font-size:11px;color:var(--tint3);margin-top:8px}
.teade{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:600;background:var(--tint);color:var(--must);padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:var(--vari);max-width:calc(100% - 32px)}

@media (max-width: 760px){
  body{overflow:auto}
  .rakendus{display:flex;flex-direction:column;height:auto;min-height:100%}
  .paneel{display:contents}
  .pais{order:1;padding-bottom:10px;gap:8px}
  .kaardiala{order:2;height:42vh;min-height:260px;flex:none;border-bottom:1px solid var(--joon)}
  .nimekiri{order:3;overflow:visible;flex:none;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .paev{top:0}
  h1{font-size:26px}
  .kiip{padding:6px 11px;font-size:13px}
  .paevanupp{padding:8px 2px 7px}
  .paevanupp span{font:800 13px/1.1 Figtree,sans-serif}
  .paevanupp.kal svg{display:none}
  .kaardinupud{bottom:14px}
  .kal-kuud{max-height:42vh}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-vaade="kaart">
<div class="rakendus">
  <aside class="paneel">
    <header class="pais">
      <div class="nimerida">
        <h1>KUHU<span class="kysi">?</span></h1>
        <div class="ikoonid">
          <button class="ikoon" id="otsiNupp" aria-label="Otsi" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
          <button class="ikoon" id="seadedNupp" aria-label="Seaded" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
        </div>
      </div>
      <input id="otsi" type="search" placeholder="Otsi üritust, kohta või linna" autocomplete="off" hidden>
      <div class="paevad" id="ajad" role="group" aria-label="Aeg"></div>
      <div class="kalender" id="kalender" hidden></div>
      <div class="kiibid" id="kategooriad" role="group" aria-label="Mis sind huvitab"></div>
      <div class="seaded" id="seaded" hidden>
        <div class="asukoht" id="asukoht"><span class="punkt"></span><span>Asukoht: <b>Elva</b></span></div>
        <button class="nupp pea" id="gpsNupp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Kasuta minu asukohta</button>
        <label>Kui kaugelt
          <select id="raadius">
            <option value="10">10 km</option><option value="25">25 km</option><option value="50" selected>50 km</option>
            <option value="100">100 km</option><option value="0">kogu Eesti</option>
          </select>
        </label>
        <label>Järjesta
          <select id="jarjestus"><option value="aeg">aja järgi</option><option value="kaugus">lähemad enne</option></select>
        </label>
        <label><input type="checkbox" id="tasuta"> Ainult tasuta</label>
        <label><input type="checkbox" id="kestvad"> Näita ka näitusi</label>
        <label><input type="checkbox" id="majad"> Kõik rahva- ja kultuurimajad kaardil</label>
        <div class="uuendatud" id="uuendatud">laen…</div>
      </div>
    </header>
    <div class="nimekiri" id="nimekiri"><div class="tyhi">Laen üritusi…</div></div>
  </aside>
  <main class="kaardiala">
    <div id="kaart" role="application" aria-label="Eesti kaart üritustega"></div>
    <div class="kaardinupud">
      <button class="nupp" id="minuleNupp" title="Kaart minu juurde"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.5 2.9L13.4 21z"/></svg></button>
    </div>
  </main>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const ELVA = { lat: 58.2226, lng: 26.4211, nimi: 'Elva' };
const KAT = {
  teater: 'Teater', muusika: 'Muusika', kino: 'Kino', pere: 'Pere', pidu: 'Pidu', sport: 'Sport', moto: 'Mootorsport',
  naitus: 'Näitus', laat: 'Laat', kirjandus: 'Kirjandus', huvi: 'Õpi ja tee', kirik: 'Kirik', muu: 'Muu',
};
// valikunupud: vähem, harvemad liigid koos „Muu" all
const VALIK = { muusika: 'Muusika', teater: 'Teater', kino: 'Kino', pere: 'Lastele', sport: 'Sport', moto: 'Mootorsport', pidu: 'Pidu', naitus: 'Näitus', muu: 'Muu' };
const grupp = k => VALIK[k] ? k : 'muu';
const MAJATYYP = { rahvamaja: 'Rahvamaja', kultuurimaja: 'Kultuurimaja', seltsimaja: 'Selts- ja külamaja', noortekeskus: 'Noortekeskus', teater: 'Teater', kino: 'Kino', kontserdisaal: 'Kontserdisaal' };
const ALLIKAS = { kk: 'Kultuurikava', fi: 'Fienta', ka: 'Kultuuriaken', pl: 'Piletilevi', ve: 'Visit Estonia', pc: 'Piletikeskus', ek: 'Eesti Kontsert', ev: 'Elva kultuur', vt: 'Visit Tallinn', ovp: 'valla koduleht', wp: 'valla koduleht', moto: 'Autospordi/Moto liit' };
const MAJA_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v10h5v-6h4v6h5V11h3z"/></svg>';
const NAV_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.5 2.9L13.4 21z"/></svg>';
const KAL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

const olek = { aeg: 'tana', kal: null, kat: new Set(), otsi: '', raadius: 50, jarjestus: 'aeg', majad: false, kestvad: false, tasuta: false, mina: { ...ELVA, gps: false }, naita: 150, kalLahti: false };
try {
  const s = JSON.parse(localStorage.getItem('kuhu') || '{}');
  Object.assign(olek, { raadius: s.raadius ?? olek.raadius, jarjestus: s.jarjestus || olek.jarjestus, majad: !!s.majad, kestvad: !!s.kestvad, tasuta: !!s.tasuta });
  if (s.mina) olek.mina = { ...s.mina, gps: false, vana: true };
} catch {}
const salvesta = () => { try { localStorage.setItem('kuhu', JSON.stringify({ raadius: olek.raadius, jarjestus: olek.jarjestus, majad: olek.majad, kestvad: olek.kestvad, tasuta: olek.tasuta, mina: olek.mina.gps ? { lat: olek.mina.lat, lng: olek.mina.lng, nimi: olek.mina.nimi } : undefined })); } catch {} };

let D = { kohad: [], yritused: [] }, MAJAD = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function km(a, b) { const R = 6371, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r; const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
const kmTekst = d => d < 1 ? `${Math.round(d * 1000 / 50) * 50} m` : d < 10 ? `${d.toFixed(1).replace('.', ',')} km` : `${Math.round(d)} km`;

// ---- aeg (Europe/Tallinn) ----
const TZ = 'Europe/Tallinn', P = 86400;
const fKell = new Intl.DateTimeFormat('et-EE', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const fPaev = new Intl.DateTimeFormat('et-EE', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
const fLyh = new Intl.DateTimeFormat('et-EE', { timeZone: TZ, day: 'numeric', month: 'numeric' });
const fKuu = new Intl.DateTimeFormat('et-EE', { timeZone: TZ, month: 'long', year: 'numeric' });
const fKuup = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const paevVoti = t => fKuup.format(new Date(t * 1000));
function paevaAlgus(voti) { // Tallinna kesköö unix-sekundites
  const [y, m, d] = voti.split('-').map(Number);
  for (const off of [3, 2]) { const t = Date.UTC(y, m - 1, d, -off) / 1000; if (paevVoti(t) === voti && paevVoti(t - 1) !== voti) return t; }
  return Date.UTC(y, m - 1, d, -2) / 1000;
}
const lisaPaevi = (voti, n) => paevVoti(paevaAlgus(voti) + n * P + 7200);
const tanaVoti = () => paevVoti(Date.now() / 1000);
function ajavahemik(v = olek.aeg) {
  const nyyd = Date.now() / 1000, tana = paevaAlgus(tanaVoti());
  if (v === 'tana') return [nyyd, tana + P + 3 * 3600]; // öised peod kuni 03
  if (v === 'homme') return [tana + P, paevaAlgus(lisaPaevi(tanaVoti(), 2))];
  if (v === 'yh') return [paevaAlgus(lisaPaevi(tanaVoti(), 2)), paevaAlgus(lisaPaevi(tanaVoti(), 3))];
  const k = olek.kal || { a: tanaVoti(), b: lisaPaevi(tanaVoti(), 60) };
  return [Math.max(nyyd, paevaAlgus(k.a)), paevaAlgus(lisaPaevi(k.b || k.a, 1))];
}
function paevaPealkiri(t) {
  const v = paevVoti(t), p = fPaev.format(new Date(t * 1000));
  return v === tanaVoti() ? `Täna · ${p}` : v === lisaPaevi(tanaVoti(), 1) ? `Homme · ${p}` : v === lisaPaevi(tanaVoti(), 2) ? `Ülehomme · ${p}` : p;
}
const lyhKp = voti => { const [, m, d] = voti.split('-'); return `${+d}.${+m}`; };
function kalSilt() {
  if (!olek.kal) return 'Kalender';
  const { a, b } = olek.kal;
  return !b || b === a ? lyhKp(a) : `${lyhKp(a)}–${lyhKp(b)}`;
}

// üritus sobib kõigi filtritega peale aja
function sobib(y, kohaKaugus) {
  if (y.kestev && !olek.kestvad && !olek.kat.has('naitus')) return false;
  if (olek.kat.size && !olek.kat.has(grupp(y.k))) return false;
  if (olek.tasuta && !y.tasuta) return false;
  if (olek.raadius && (kohaKaugus ? kohaKaugus[y.p] : km(olek.mina, D.kohad[y.p])) > olek.raadius) return false;
  if (olek.otsi) { const k = D.kohad[y.p]; if (!(y._n ??= norm(y.n + ' ' + k.n + ' ' + k.linn + ' ' + k.a)).includes(olek.otsi)) return false; }
  return true;
}
// ürituste arv päeva kaupa (algavad sel päeval; kestvad ainult siis, kui on sisse lülitatud)
let paevaloend = {};
function loePaevad(kohaKaugus) {
  paevaloend = {};
  const nyyd = Date.now() / 1000;
  for (const y of D.yritused) {
    if (y.e < nyyd || !sobib(y, kohaKaugus)) continue;
    const v = paevVoti(Math.max(y.s, nyyd));
    paevaloend[v] = (paevaloend[v] || 0) + 1;
  }
}

// ---- UI: ajanupud, kalender, kategooriad ----
function kiibid() {
  const t = tanaVoti();
  const arv = { tana: paevaloend[t], homme: paevaloend[lisaPaevi(t, 1)], yh: paevaloend[lisaPaevi(t, 2)] };
  let kalArv = 0; if (olek.aeg === 'kal') kalArv = tulem.length;
  $('ajad').innerHTML = [['tana', 'Täna'], ['homme', 'Homme'], ['yh', 'Ülehomme']]
    .map(([v, n]) => `<button class="paevanupp" data-aeg="${v}" aria-pressed="${olek.aeg === v}"><span>${n}</span><b>${arv[v] ?? 0}</b></button>`).join('')
    + `<button class="paevanupp kal" data-aeg="kal" aria-pressed="${olek.aeg === 'kal'}" aria-expanded="${olek.kalLahti}"><span>${esc(kalSilt())}</span><b>${olek.aeg === 'kal' ? kalArv : 'vali päev'}</b></button>`;
  $('kategooriad').innerHTML = `<button class="kiip" data-kat="" aria-pressed="${olek.kat.size === 0}">Kõik</button>` +
    Object.entries(VALIK).map(([k, n]) => `<button class="kiip aktsent" data-kat="${k}" aria-pressed="${olek.kat.has(k)}">${n}</button>`).join('');
  joonistaKalender();
}
function joonistaKalender() {
  const el = $('kalender');
  el.hidden = !olek.kalLahti;
  if (!olek.kalLahti) return;
  const t = tanaVoti(), viimane = lisaPaevi(t, 60);
  const max = Math.max(1, ...Object.values(paevaloend));
  const { a, b } = olek.kal || {};
  let h = `<div class="kal-kiirvalik">
    <button class="kiip" data-kiir="nv">Nädalavahetus</button><button class="kiip" data-kiir="7">Järgmised 7 päeva</button><button class="kiip" data-kiir="30">30 päeva</button><button class="kiip" data-kiir="koik">Kõik</button></div><div class="kal-kuud">`;
  let kuu = t.slice(0, 7);
  while (kuu <= viimane.slice(0, 7)) {
    const [y, m] = kuu.split('-').map(Number);
    const esimene = `${kuu}-01`;
    const nadalap = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7; // E=0
    const paevi = new Date(Date.UTC(y, m, 0)).getUTCDate();
    h += `<div class="kal-kuu"><h4>${esc(fKuu.format(new Date(paevaAlgus(esimene) * 1000 + 7200e3)))}</h4><div class="kal-ruudud">` +
      ['E', 'T', 'K', 'N', 'R', 'L', 'P'].map(x => `<div class="kal-nadalap">${x}</div>`).join('') + '<div></div>'.repeat(nadalap);
    for (let d = 1; d <= paevi; d++) {
      const v = `${kuu}-${String(d).padStart(2, '0')}`;
      const n = paevaloend[v] || 0;
      const valjas = v < t || v > viimane;
      const tase = !n ? 0 : n / max > .5 ? 3 : n / max > .2 ? 2 : 1;
      const cls = [v === a || v === (b || a) ? 'valitud' : '', a && b && v > a && v < b ? 'vahemik' : '', v === t ? 'tana' : ''].join(' ');
      h += `<button class="kal-paev ${cls}" data-paev="${v}" data-tase="${tase}" ${valjas ? 'disabled' : ''} aria-label="${d}. ${n} üritust"><span class="nr">${d}</span><span class="arv">${n && !valjas ? n : ''}</span></button>`;
    }
    h += '</div></div>';
    kuu = m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`;
  }
  h += `</div><div class="kal-jalus"><span>${olek.kal ? (olek.kal.b && olek.kal.b !== olek.kal.a ? 'Vahemik valitud' : 'Vali teine päev, kui soovid vahemikku') : 'Vali päev'}</span><button class="nupp pea" id="kalValmis">Valmis</button></div>`;
  el.innerHTML = h;
}
$('ajad').onclick = e => {
  const b = e.target.closest('[data-aeg]'); if (!b) return;
  const v = b.dataset.aeg;
  if (v === 'kal') { olek.kalLahti = !olek.kalLahti; if (!olek.kal) olek.kal = null; olek.aeg = 'kal'; }
  else { olek.aeg = v; olek.kalLahti = false; }
  arvuta();
};
let kalKlikk = 0;
$('kalender').onclick = e => {
  if (e.target.closest('#kalValmis')) { olek.kalLahti = false; kiibid(); setTimeout(() => kaart.invalidateSize(), 50); return; }
  const kiir = e.target.closest('[data-kiir]');
  if (kiir) {
    const t = tanaVoti(), nd = (new Date(paevaAlgus(t) * 1000 + 7200e3).getUTCDay() + 6) % 7; // E=0
    if (kiir.dataset.kiir === 'nv') { const r = nd >= 4 ? t : lisaPaevi(t, 4 - nd); olek.kal = { a: nd === 6 ? t : r, b: lisaPaevi(t, 6 - nd) }; }
    else if (kiir.dataset.kiir === '7') olek.kal = { a: t, b: lisaPaevi(t, 6) };
    else if (kiir.dataset.kiir === '30') olek.kal = { a: t, b: lisaPaevi(t, 29) };
    else olek.kal = { a: t, b: lisaPaevi(t, 60) };
    olek.aeg = 'kal'; kalKlikk = 0; arvuta(); return;
  }
  const p = e.target.closest('[data-paev]'); if (!p || p.disabled) return;
  const v = p.dataset.paev;
  if (kalKlikk === 1 && olek.kal && v > olek.kal.a) { olek.kal = { a: olek.kal.a, b: v }; kalKlikk = 0; }
  else { olek.kal = { a: v, b: v }; kalKlikk = 1; }
  olek.aeg = 'kal'; arvuta();
};
$('kategooriad').onclick = e => {
  const b = e.target.closest('[data-kat]'); if (!b) return; const k = b.dataset.kat;
  const oli = olek.kat.has(k); olek.kat.clear(); if (k && !oli) olek.kat.add(k);
  arvuta();
};
let otsiTaimer; $('otsi').oninput = e => { clearTimeout(otsiTaimer); otsiTaimer = setTimeout(() => { olek.otsi = norm(e.target.value.trim()); arvuta(); }, 180); };
for (const [id, v, tyyp] of [['raadius', 'raadius', 'num'], ['jarjestus', 'jarjestus'], ['majad', 'majad', 'bool'], ['kestvad', 'kestvad', 'bool'], ['tasuta', 'tasuta', 'bool']]) {
  const el = $(id); if (tyyp === 'bool') el.checked = olek[v]; else el.value = String(olek[v]);
  el.onchange = () => { olek[v] = tyyp === 'bool' ? el.checked : tyyp === 'num' ? +el.value : el.value; salvesta(); arvuta(id === 'raadius'); };
}
function vaade() { if (matchMedia('(max-width: 760px)').matches) document.querySelector('.kaardiala').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
$('otsiNupp').onclick = () => { const i = $('otsi'); i.hidden = !i.hidden; $('otsiNupp').setAttribute('aria-expanded', !i.hidden); if (!i.hidden) i.focus(); else if (i.value) { i.value = ''; olek.otsi = ''; arvuta(); } };
$('seadedNupp').onclick = () => { const x = $('seaded'); x.hidden = !x.hidden; $('seadedNupp').setAttribute('aria-expanded', !x.hidden); };

// ---- kaart ----
const kaart = L.map('kaart', { zoomControl: false, minZoom: 6 }).setView([olek.mina.lat, olek.mina.lng], 10);
L.control.zoom({ position: 'topright' }).addTo(kaart);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'hele-kaart', attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(kaart);

const klastrid = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 44, spiderfyOnMaxZoom: true, chunkedLoading: true,
  iconCreateFunction: c => { const n = c.getAllChildMarkers().reduce((s, m) => s + (m.options.arv || 1), 0); return L.divIcon({ html: `<div>${n > 999 ? '999+' : n}</div>`, className: 'marker-cluster', iconSize: [40, 40] }); } });
const majaKiht = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 30, disableClusteringAtZoom: 11,
  iconCreateFunction: c => L.divIcon({ html: `<div class="maja" style="width:26px;height:26px;font:800 11px/1 Figtree">${c.getChildCount()}</div>`, className: '', iconSize: [26, 26] }) });
kaart.addLayer(klastrid);
let minaMarker, tapsusRing, raadiusRing;
const kohaMarkerid = new Map();

function minaKaardile() {
  const p = [olek.mina.lat, olek.mina.lng];
  if (!minaMarker) minaMarker = L.marker(p, { icon: L.divIcon({ className: '', html: '<div class="mina"></div>', iconSize: [18, 18] }), zIndexOffset: 1000, keyboard: false, interactive: false }).addTo(kaart);
  else minaMarker.setLatLng(p);
  if (olek.mina.tapsus) { if (!tapsusRing) tapsusRing = L.circle(p, { radius: olek.mina.tapsus, color: '#4da3ff', weight: 1, fillOpacity: .08, interactive: false }).addTo(kaart); else tapsusRing.setLatLng(p).setRadius(olek.mina.tapsus); }
  if (raadiusRing) { kaart.removeLayer(raadiusRing); raadiusRing = null; }
  if (olek.raadius) raadiusRing = L.circle(p, { radius: olek.raadius * 1000, color: '#ff6a13', opacity: .55, weight: 1.5, dashArray: '5 7', fill: false, interactive: false }).addTo(kaart);
}

function kohaPopup(k, kohaYr, maja) {
  const pilt = kohaYr.find(y => y.img || y.imgUrl);
  const pildiUrl = pilt ? (pilt.imgUrl || `${pilt.u}?do=image`) : '';
  const rida = y => `<li><div class="aeg"><b>${y.kestev ? `kuni ${fLyh.format(new Date(y.e * 1000))}` : y.paev ? `${fLyh.format(new Date(y.s * 1000))}, terve päev` : `${fLyh.format(new Date(y.s * 1000))} kell ${fKell.format(new Date(y.s * 1000))}`}</b> · ${esc(KAT[y.k])}${y.tasuta ? ' · tasuta' : ''} · ${esc(ALLIKAS[y.src] || '')}</div><a href="${esc(y.u)}" target="_blank" rel="noopener">${esc(y.n)}</a></li>`;
  return `<div class="pp">${pildiUrl ? `<img src="${esc(pildiUrl)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
    ${maja ? `<div class="tyyp">${esc(MAJATYYP[maja.t] || 'Kultuurikoht')}</div>` : ''}
    <h3>${esc(k.n)}</h3><div class="aad">${esc(k.a || k.linn || '')} · ${kmTekst(km(olek.mina, k))} ${olek.mina.gps ? 'sinust' : 'Elvast'}</div>
    ${kohaYr.length ? `<ul>${kohaYr.slice(0, 40).map(rida).join('')}</ul>` : '<div class="aad">Valitud ajal siin üritusi ei leitud.</div>'}
    <div class="lingid"><a class="juhata" href="${navLink(k)}" data-lat="${k.lat}" data-lng="${k.lng}" target="_blank" rel="noopener">${NAV_SVG}Juhata kohale</a>${(k.www || maja?.www) ? `<a href="${esc(k.www || maja.www)}" target="_blank" rel="noopener">Koduleht</a>` : ''}${maja?.tel ? `<span>${esc(maja.tel)}</span>` : ''}</div>
    ${k.ligi ? '<div class="ligi">Asukoht on ligikaudne (asula keskpunkt).</div>' : ''}</div>`;
}
// teejuhis alati sinu asukohast: kui GPS on teada, pannakse see lähtekohaks
function navLink(k, mina = olek.mina.gps ? olek.mina : null) {
  return `https://www.google.com/maps/dir/?api=1${mina ? `&origin=${mina.lat.toFixed(6)},${mina.lng.toFixed(6)}` : ''}&destination=${k.lat},${k.lng}&travelmode=driving`;
}
document.addEventListener('click', e => {
  const a = e.target.closest('a.juhata'); if (!a || olek.mina.gps || !navigator.geolocation) return;
  // asukoht pole veel teada → küsi see enne teejuhise avamist
  e.preventDefault();
  teade('Otsin sinu asukohta teejuhise jaoks…');
  const siht = { lat: +a.dataset.lat, lng: +a.dataset.lng };
  navigator.geolocation.getCurrentPosition(pos => {
    const mina = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    location.href = navLink(siht, mina);
    kaivitaGps(false);
  }, () => { location.href = navLink(siht, null); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
});

// ---- filtreerimine ----
let tulem = [];
function arvuta(liiguta) {
  const [alg, lopp] = ajavahemik();
  const kohaKaugus = D.kohad.map(k => km(olek.mina, k));
  loePaevad(kohaKaugus);
  const tanaAeg = olek.aeg === 'tana';
  tulem = D.yritused.filter(y => {
    if (y.e < alg || y.s > lopp) return false;
    if (!tanaAeg && !y.kestev && !y.paev && y.s < alg && paevVoti(y.s) !== paevVoti(alg)) return false;
    return sobib(y, kohaKaugus);
  });
  for (const y of tulem) y._d = kohaKaugus[y.p];
  if (olek.jarjestus === 'kaugus') tulem.sort((a, b) => a._d - b._d || a.s - b.s);
  else { const pv = y => paevVoti(Math.max(y.s, alg)); tulem.sort((a, b) => (pv(a) < pv(b) ? -1 : pv(a) > pv(b) ? 1 : 0) || (!!a.kestev - !!b.kestev) || (!!b.paev - !!a.paev) || a.s - b.s || a._d - b._d); }
  olek.naita = 150;
  kiibid(); joonistaNimekiri(); joonistaKaart(); minaKaardile();
  if (liiguta && raadiusRing) kaart.fitBounds(raadiusRing.getBounds(), { padding: [20, 20] });
}

function joonistaNimekiri() {
  const el = $('nimekiri');
  const kohti = new Set(tulem.map(y => y.p)).size;
  const kust = olek.mina.gps ? (olek.mina.nimi ? `${olek.mina.nimi} ümbruses` : 'sinu lähedal') : 'Elva ümbruses';
  const kus = olek.raadius ? `${kust}, kuni ${olek.raadius} km` : 'kogu Eestis';
  let h = `<div class="kokkuvote"><b>${tulem.length}</b> üritust <b>${kohti}</b> kohas · ${esc(kus)}</div>`;
  if (!tulem.length) {
    h += `<div class="tyhi">Selle valikuga üritusi ei leitud.${olek.raadius && olek.raadius < 100 ? '<button class="nupp lisa" id="laienda">Otsi 100 km raadiuses</button>' : ''}</div>`;
  } else {
    let eelm = '';
    const [alg] = ajavahemik();
    const nyyd = Date.now() / 1000;
    for (const y of tulem.slice(0, olek.naita)) {
      const k = D.kohad[y.p];
      const paevT = Math.max(y.s, alg);
      if (olek.jarjestus === 'aeg') { const pv = paevVoti(paevT); if (pv !== eelm) { h += `<div class="paev">${esc(paevaPealkiri(paevT))}</div>`; eelm = pv; } }
      const teinePaev = paevVoti(y.s) !== paevVoti(paevT);
      const kell = y.kestev ? `<small>kuni</small>${fLyh.format(new Date(y.e * 1000))}` : y.paev ? `<small>terve</small>päev`
        : `${fKell.format(new Date(y.s * 1000))}${olek.jarjestus === 'kaugus' || teinePaev ? `<small>${teinePaev ? 'alates ' : ''}${fLyh.format(new Date(y.s * 1000))}</small>` : ''}`;
      const linn = k.linn && k.linn !== 'Muu' && !k.n.includes(k.linn) ? `, ${esc(k.linn)}` : '';
      h += `<button class="yr" data-p="${y.p}"><div class="kell">${kell}</div><div><div class="pk">${esc(y.n)}</div><div class="koht">${esc(k.n)}${linn}</div><div class="silt">${esc(grupp(y.k) === 'muu' ? KAT[y.k] : VALIK[y.k])}${y.tasuta ? '<span class="pill">tasuta</span>' : ''}${!y.kestev && !y.paev && y.s < nyyd && y.e > nyyd ? '<span class="pill kaib">käib</span>' : ''}</div></div><div class="kaugus">${kmTekst(y._d)}</div></button>`;
    }
    if (tulem.length > olek.naita) h += `<button class="nupp lisa" id="rohkem">Näita veel ${Math.min(150, tulem.length - olek.naita)}</button>`;
  }
  h += `<div class="allikad">Andmed: Kultuurikava, Kultuuriaken, Piletilevi, Piletikeskus, Fienta, Eesti Kontsert, Visit Estonia, Visit Tallinn, elvakultuur.ee, valdade kodulehed, Autospordi Liit, Mootorrattaspordi Föderatsioon; majad <a href="https://www.openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a>. Kontrolli aega korraldaja lehelt.</div>`;
  el.innerHTML = h;
  $('rohkem')?.addEventListener('click', () => { olek.naita += 150; const s = el.scrollTop; joonistaNimekiri(); el.scrollTop = s; });
  $('laienda')?.addEventListener('click', () => { olek.raadius = 100; $('raadius').value = '100'; salvesta(); arvuta(true); });
}
$('nimekiri').addEventListener('click', e => {
  const b = e.target.closest('.yr'); if (!b) return;
  const m = kohaMarkerid.get(+b.dataset.p); if (!m) return;
  vaade('kaart');
  klastrid.zoomToShowLayer(m, () => m.openPopup());
});

// kaardil ainult kohad, kus valitud ajal midagi toimub
function joonistaKaart() {
  klastrid.clearLayers(); kohaMarkerid.clear();
  const kohaYr = new Map();
  for (const y of tulem) { if (!kohaYr.has(y.p)) kohaYr.set(y.p, []); kohaYr.get(y.p).push(y); }
  const markerid = [];
  for (const [p, yr] of kohaYr) {
    const k = D.kohad[p];
    const m = L.marker([k.lat, k.lng], { arv: yr.length, icon: L.divIcon({ className: '', html: `<div class="m${yr.length === 1 ? ' yks' : ''}">${yr.length > 99 ? '99+' : yr.length}</div>`, iconSize: [0, 0] }), title: `${k.n} · ${yr.length} üritust` });
    m.bindPopup(() => kohaPopup(k, [...yr].sort((a, b) => a.s - b.s), lahimMaja(k)), { maxWidth: 330, autoPanPaddingTopLeft: [10, 60] });
    kohaMarkerid.set(p, m); markerid.push(m);
  }
  klastrid.addLayers(markerid);
  joonistaMajad(kohaYr);
}
function lahimMaja(k) { let parim = null, pd = .15; for (const m of MAJAD) { if (Math.abs(m.lat - k.lat) > .01) continue; const d = km(k, m); if (d < pd) { pd = d; parim = m; } } return parim; }
function joonistaMajad(kohaYr) {
  majaKiht.clearLayers();
  if (!olek.majad) { if (kaart.hasLayer(majaKiht)) kaart.removeLayer(majaKiht); return; }
  const markerid = [];
  for (const m of MAJAD) {
    if (olek.raadius && km(olek.mina, m) > olek.raadius) continue;
    let topelt = false;
    for (const [p] of kohaYr) { const k = D.kohad[p]; if (Math.abs(k.lat - m.lat) < .002 && km(k, m) < .15) { topelt = true; break; } }
    if (topelt) continue;
    const mk = L.marker([m.lat, m.lng], { icon: L.divIcon({ className: '', html: `<div class="maja" title="${esc(m.n)}">${MAJA_SVG}</div>`, iconSize: [22, 22] }), title: m.n });
    mk.bindPopup(() => kohaPopup({ n: m.n, a: m.a, lat: m.lat, lng: m.lng, www: m.www }, [], m), { maxWidth: 330 });
    markerid.push(mk);
  }
  majaKiht.addLayers(markerid);
  if (!kaart.hasLayer(majaKiht)) kaart.addLayer(majaKiht);
}

// ---- GPS ----
let jalgija;
function naitaAsukohta(tekst, gps) { $('asukoht').innerHTML = `<span class="punkt${gps ? ' gps' : ''}"></span><span>${tekst}</span>`; }
function kohanimi(lat, lng) {
  let parim = null, pd = 1e9;
  for (const k of D.kohad) { const d = km({ lat, lng }, k); if (d < pd && k.linn && k.linn !== 'Muu') { pd = d; parim = k.linn; } }
  return pd < 15 ? parim : null;
}
function kaivitaGps(lenda = true) {
  if (!navigator.geolocation) { naitaAsukohta('Seade ei toeta asukoha määramist. Kasutan Elvat.', false); return; }
  if (jalgija != null && olek.mina.gps) { if (lenda) kaart.setView([olek.mina.lat, olek.mina.lng], Math.max(kaart.getZoom(), 11)); return; }
  naitaAsukohta('Otsin asukohta…', false);
  let esimene = true;
  if (jalgija != null) navigator.geolocation.clearWatch(jalgija);
  jalgija = navigator.geolocation.watchPosition(pos => {
    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
    const nihkunud = !olek.mina.gps || km(olek.mina, { lat, lng }) > .3;
    olek.mina = { lat, lng, gps: true, tapsus: accuracy, nimi: kohanimi(lat, lng) };
    naitaAsukohta(`Sinu asukoht${olek.mina.nimi ? `: <b>${esc(olek.mina.nimi)}</b>` : ''} (±${Math.round(accuracy)} m)`, true);
    salvesta();
    if (nihkunud) arvuta(esimene && lenda); else minaKaardile();
    esimene = false;
  }, err => {
    const pohjus = err.code === 1 ? 'Asukoha luba puudub (luba see brauseri seadetest).' : 'Asukohta ei leitud.';
    naitaAsukohta(`${pohjus} Näitan: <b>${esc(olek.mina.nimi || 'Elva')}</b>`, false);
    teade(pohjus);
  }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
}
$('gpsNupp').onclick = () => kaivitaGps(true);
$('minuleNupp').onclick = () => { if (!olek.mina.gps) kaivitaGps(true); else kaart.setView([olek.mina.lat, olek.mina.lng], Math.max(kaart.getZoom(), 12)); };
function teade(t) { document.querySelectorAll('.teade').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'teade'; d.textContent = t; document.querySelector('.kaardiala').append(d); setTimeout(() => d.remove(), 4000); }

// ---- käivitus ----
kiibid();
naitaAsukohta(olek.mina.vana ? `Viimane asukoht: <b>${esc(olek.mina.nimi || 'salvestatud')}</b>` : 'Asukoht: <b>Elva</b>', false);
Promise.all([fetch('data/yritused.json').then(r => r.json()), fetch('data/kultuurikohad.json').then(r => r.json()).catch(() => ({ kohad: [] }))])
  .then(([y, m]) => {
    D = y; MAJAD = m.kohad || [];
    const t = new Date(y.uuendatud * 1000);
    $('uuendatud').textContent = `Andmebaasis ${D.yritused.length.toLocaleString('et-EE')} üritust, uuendatud ${fLyh.format(t)} kell ${fKell.format(t)}`;
    arvuta(true);
    // küsi asukohta kohe; keeldumisel jääb Elva
    kaivitaGps(true);
  })
  .catch(e => { $('nimekiri').innerHTML = `<div class="tyhi">Andmete laadimine ebaõnnestus (${esc(e.message)}). Värskenda lehte.</div>`; });
</script>
